name: validate

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate plugin (manifests, frontmatter, links, house conventions)
        run: python3 scripts/validate_plugin.py
